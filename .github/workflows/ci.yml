name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The floor the project claims to support, and current.
        node: [20, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No npm dependencies. chafa is the one real requirement, and the suite
      # drives a real pane: without it the pane cannot draw a frame, and the
      # test that reads back what it drew fails having seen nothing at all.
      # That is what kept this red from v1.7.0 to v1.9.1.
      - name: chafa
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chafa

      - name: Syntax
        run: for f in src/*.mjs bin/*.mjs install.mjs; do node --check "$f"; done

      # Catches what --check cannot: a module that parses but cannot resolve
      # what it imports.
      - name: Smoke
        run: npm test

      - name: Credits are up to date
        run: npm run attribution -- --check
